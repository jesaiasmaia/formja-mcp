[project]
name = "formja-mcp"
version = "0.1.0"
description = "MCP Server for FormJA CRM"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
formja-mcp = "formja_mcp.server_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formja_mcp"]
